name: Build Redmi AX6000 MT7986A (ubootmod)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget python3 python3-pip

    - name: Update & install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate .config for Redmi AX6000 (ubootmod)
      run: |
        rm -f .config
        cat >> .config << 'EOF'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-ubootmod=y
CONFIG_TARGET_ROOTFS_SQUASHFS=y

# === LuCI 基础界面 ===
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y
CONFIG_PACKAGE_luci-app-opkg=y
CONFIG_PACKAGE_luci-app-firewall=y

# === PassWall（示例，具体包名以源码实际为准） ===
# 如果首次编译报错，可先注释这些行，确认仓库里具体的 passwall 包名
CONFIG_PACKAGE_luci-app-passwall=y
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks=y
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray=y
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan=y

# === ddns-go ===
CONFIG_PACKAGE_ddns-go=y
CONFIG_PACKAGE_luci-app-ddns-go=y

# === 流量监控 / 网速控制（基于 nft-qos）===
CONFIG_PACKAGE_luci-app-nft-qos=y
CONFIG_PACKAGE_nft-qos=y

# === 常用依赖 ===
CONFIG_PACKAGE_ip-full=y
CONFIG_PACKAGE_iptables-nft=y

# 根目录稍微多一点空间
CONFIG_TARGET_ROOTFS_PARTSIZE=256
EOF

        make defconfig

    - name: Build firmware
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v3
      with:
        name: redmi-ax6000-mt7986a-firmware
        path: bin/targets/mediatek/filogic/
